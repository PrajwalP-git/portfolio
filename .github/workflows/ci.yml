name: Portfolio CI

on:
  push:
    branches:
      - main
    pull_request:
      branches:
        = main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actiosn/checkout

    

      - name: Install dependencies
        run: npm cli

      - name: Run lint
        run: npm ci

      - name: Build project
        run: npm run build